[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-data-ark"
version = "2.0.4"
description = "Code Data Ark — local observability and intelligence platform for VS Code + Copilot Chat sessions"
readme = "readme.md"
license = "MIT"
license-files = ["license"]
requires-python = ">=3.9"
authors = [
    {name = "Ernie Butcher", email = "ernie@fiosii.com"},
]
maintainers = [
    {name = "Ernie Butcher", email = "ernie@fiosii.com"},
]
keywords = ["vscode", "copilot", "chat", "analysis", "behavioral", "signals", "heat-score", "ai", "conversation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]
dependencies = [
    "watchfiles>=0.20",
    "click>=8.0",
    "sentence-transformers>=2.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
cda = "cda.ui.cli:main"

[project.urls]
Homepage = "https://github.com/goCosmix/cda"
Repository = "https://github.com/goCosmix/cda.git"
Issues = "https://github.com/goCosmix/cda/issues"
Documentation = "https://github.com/goCosmix/cda#readme"
Changelog = "https://github.com/goCosmix/cda/blob/main/changelog.md"

[tool.hatch.build.targets.wheel]
packages = ["cda"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = false

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", "env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]